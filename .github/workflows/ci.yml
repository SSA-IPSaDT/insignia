name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    DATABASE_HOST: localhost
    DATABASE_PORT: 52000
    DATABASE_USER: insignia
    DATABASE_PASSWORD: insignia_password
    DATABASE_NAME: insignia

jobs:
    verify:
        name: Code Quality & Build Checks
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: insignia
                    POSTGRES_PASSWORD: insignia_password
                    POSTGRES_DB: insignia
                ports:
                    - 52000:5432
                options: >-
                    --health-cmd "pg_isready -U insignia -d insignia"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup toolchain from mise.toml
              uses: jdx/mise-action@v5
              with:
                  cache: true

            - name: Cache Bun dependencies
              uses: actions/cache@v6
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Cache Moonrepo
              uses: actions/cache@v6
              with:
                  path: .moon/cache
                  key: ${{ runner.os }}-moon-${{ hashFiles('**/bun.lock', '.moon/**/*.yml') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-moon-${{ hashFiles('**/bun.lock', '.moon/**/*.yml') }}-
                      ${{ runner.os }}-moon-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run HK hygiene checks
              run: bun run hk:check

            - name: Check code formatting
              run: bun run fmt:check

            - name: Build applications and packages
              run: bun run build

            - name: Emit Prisma database contract
              run: bun --filter @insignia/database contract:emit

            - name: Typecheck all projects
              run: bun run check

            - name: Initialize database schema
              run: bun run db:init

            - name: Verify database schema integrity
              run: bun --filter @insignia/database db:verify

            - name: Seed database with test dataset
              run: bun --filter @insignia/database db:seed

            - name: Run automated test suite
              run: bun run test
