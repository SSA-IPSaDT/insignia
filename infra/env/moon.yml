$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
stack: 'infrastructure'

dependsOn:
    - 'tsconfig'

tasks:
    build:
        command: 'bun run build.ts'
        inputs:
            - 'src/**/*'
            - 'tsconfig.json'
            - 'tsconfig.build.json'
            - 'build.ts'
        outputs:
            - 'dist/**/*'

    check:
        command: 'bun check'
        inputs:
            - 'src/**/*'
            - 'tsconfig.json'

    test:
        command: 'bun test tests'
        inputs:
            - 'src/**/*'
            - 'tests/**/*'
            - 'tsconfig.json'
