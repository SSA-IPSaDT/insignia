$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
stack: 'backend'

dependsOn:
    - 'contracts'
    - 'logger'
    - 'env'
    - 'sdk'
    - 'api'

tasks:
    dev:
        command: 'bun run --watch src/index.ts'
        deps:
            - 'api:dev'
        options:
            persistent: true
            runInCI: false

    build:
        command: 'bun build src/index.ts --outdir dist --target bun'
        inputs:
            - 'src/**/*'
            - 'package.json'
            - 'tsconfig.json'
        outputs:
            - 'dist'

    check:
        command: 'bun check'
        inputs:
            - 'src/**/*'
            - 'tests/**/*'
            - 'tsconfig.json'

    test:
        command: 'bun test'
        inputs:
            - 'src/**/*'
            - 'tests/**/*'
            - 'package.json'
