$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
stack: 'backend'

dependsOn:
    - 'contracts'
    - 'database'
    - 'logger'
    - 'env'

tasks:
    dev:
        command: 'bun run --watch src/index.ts'
        options:
            persistent: true
            runInCI: false

    build:
        command: 'bun run build.ts'
        deps:
            - 'env:build'
        inputs:
            - 'src/**/*'
            - 'package.json'
            - 'tsconfig.json'
            - 'build.ts'
        outputs:
            - 'dist/**/*'

    check:
        command: 'bun check'
        inputs:
            - 'src/**/*'
            - 'tsconfig.json'

    test:
        command: 'bun test tests'
        inputs:
            - 'src/**/*'
            - 'tests/**/*'
            - 'tsconfig.json'
