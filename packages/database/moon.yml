$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
stack: 'infrastructure'

dependsOn:
    - 'env'
    - 'tsconfig'

tasks:
    check:
        command: 'bun check'
        inputs:
            - 'src/**/*'
            - 'tsconfig.json'

    test:
        command: 'bun test tests'
        inputs:
            - 'src/**/*'
            - 'tests/**/*'
            - 'tsconfig.json'

    contract-emit:
        command: 'bun x prisma contract emit'
        inputs:
            - 'src/schemas/**/*.prisma'
            - 'prisma.config.ts'
        outputs:
            - 'src/schemas/contract.json'
            - 'src/schemas/contract.d.ts'

    db-init:
        command: 'bun x prisma db init'
        inputs:
            - 'src/schemas/contract.json'
            - 'prisma.config.ts'
        options:
            cache: false
