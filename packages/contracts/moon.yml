$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
stack: 'infrastructure'

dependsOn:
    - 'tsconfig'

tasks:
    check:
        command: 'bun check'
        inputs:
            - 'src/**/*'
            - 'tsconfig.json'

    test:
        command: 'bun test tests'
        inputs:
            - 'src/**/*'
            - 'tests/**/*'
            - 'tsconfig.json'
